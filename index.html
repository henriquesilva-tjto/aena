<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AENA · Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="card login-box">
    <div class="logo">
      <b>AENA</b>
      <div class="muted">Alimentação Escolar · Novo Acordo-TO</div>
      <small>Secretaria Municipal de Educação</small>
    </div>

    <form id="fLogin">
      <div class="row"><div class="field"><label for="login">Usuário</label>
        <input id="login" name="login" autocomplete="username" required autofocus></div></div>
      <div class="row"><div class="field"><label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required></div></div>
      <div id="msg" class="alert bad hidden"></div>
      <button type="submit" style="width:100%">Entrar</button>
    </form>

    <form id="fTroca" class="hidden">
      <div class="alert info">Primeiro acesso: defina uma nova senha pessoal.</div>
      <div class="row"><div class="field"><label for="nova">Nova senha</label>
        <input id="nova" type="password" autocomplete="new-password" required></div></div>
      <div class="row"><div class="field"><label for="nova2">Repita a nova senha</label>
        <input id="nova2" type="password" autocomplete="new-password" required></div></div>
      <small class="muted">Mínimo de 8 caracteres, com letras e números.</small>
      <div id="msg2" class="alert bad hidden"></div>
      <button type="submit" style="width:100%;margin-top:.6rem">Salvar e entrar</button>
    </form>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
(async function () {
  DB.load();
  await Auth.garantirUsuarios();
  const params = new URLSearchParams(location.search);
  const volta = params.get('volta');

  function destino(papel) {
    if (volta && Auth.ACESSO[volta] && Auth.ACESSO[volta].includes(papel)) return volta;
    return Auth.paginaInicial(papel);
  }

  function mostrarTroca() {
    UI.$('#fLogin').classList.add('hidden');
    UI.$('#fTroca').classList.remove('hidden');
    UI.$('#nova').focus();
  }

  const sess = Auth.session();
  if (sess) {
    const u = DB.get('usuarios', sess.userId);
    if (u && u.trocarSenha) mostrarTroca();
    else if (u) location.replace(destino(sess.papel));
  }

  UI.$('#fLogin').addEventListener('submit', async ev => {
    ev.preventDefault();
    const r = await Auth.login(UI.$('#login').value, UI.$('#senha').value);
    const m = UI.$('#msg');
    if (!r.ok) { m.textContent = r.msg; m.classList.remove('hidden'); return; }
    if (r.trocarSenha) return mostrarTroca();
    location.replace(destino(r.user.papel));
  });

  UI.$('#fTroca').addEventListener('submit', async ev => {
    ev.preventDefault();
    const m = UI.$('#msg2');
    const n1 = UI.$('#nova').value, n2 = UI.$('#nova2').value;
    let erro = Auth.validaSenha(n1);
    if (!erro && n1 !== n2) erro = 'As senhas não conferem.';
    if (!erro && n1 === 'aena2026') erro = 'Escolha uma senha diferente da senha inicial.';
    if (erro) { m.textContent = erro; m.classList.remove('hidden'); return; }
    const s = Auth.session();
    if (!s) return location.reload();
    await Auth.setSenha(s.userId, n1);
    location.replace(destino(s.papel));
  });
})();
</script>
</body>
</html>
